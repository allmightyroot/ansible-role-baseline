---
repos:
  # >>> BEGIN managed baseline: edit dotfiles/precommit-baseline/.pre-commit-config.yaml, then run precommit-baseline
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents", "--unsafe"]
      - id: check-merge-conflict
      - id: check-added-large-files
      # Mac/Linux/Windows hygiene: mixed line endings ("auto" only fixes files
      # that mix them; it never converts a consistently-CRLF file) and
      # filenames that differ only by case.
      - id: mixed-line-ending
      - id: check-case-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # <<< END managed baseline

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint"]

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.6.0
    hooks:
      - id: ansible-lint
